<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1f2937, #111827);
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .calculator {
      width: 300px;
      background: #f3f4f6;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      margin-bottom: 20px;
    }

    #display {
      width: 100%;
      height: 60px;
      font-size: 2rem;
      text-align: right;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      padding: 10px 12px;
      margin-bottom: 18px;
      color: #111827;
      font-family: monospace;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 55px;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.1s ease;
    }

    button:active {
      transform: scale(0.95);
      filter: brightness(0.9);
    }

    .number {
      background: #e5e7eb;
      color: #111827;
    }

    .operator {
      background: #f59e0b;
      color: white;
    }

    .clear {
      background: #ef4444;
      color: white;
    }

    .equals {
      background: #10b981;
      color: white;
      grid-column: span 2;
    }

    .footer {
      font-size: 11px;
      color: #666;
      text-align: center;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input id="display" type="text" disabled value="0" />

    <div class="buttons">
      <button class="clear" data-action="clear">C</button>
      <button class="operator" data-value="/">÷</button>
      <button class="operator" data-value="*">×</button>
      <button class="operator" data-value="-">−</button>

      <button class="number" data-value="7">7</button>
      <button class="number" data-value="8">8</button>
      <button class="number" data-value="9">9</button>
      <button class="operator" data-value="+">+</button>

      <button class="number" data-value="4">4</button>
      <button class="number" data-value="5">5</button>
      <button class="number" data-value="6">6</button>
      <button class="operator" data-action="backspace">⌫</button>

      <button class="number" data-value="1">1</button>
      <button class="number" data-value="2">2</button>
      <button class="number" data-value="3">3</button>
      <button class="number" data-value=".">.</button>

      <button class="number" data-value="0" style="grid-column: span 2;">0</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </div>

  <div class="footer">
    ©1933保留所有权利
  </div>

  <script>
    const display = document.getElementById("display");
    let expression = "";
    let isEvaluated = false;

    function updateDisplay() {
      display.value = expression || "0";
    }

    function resetIfError() {
      if (expression === "Error") {
        expression = "";
        isEvaluated = false;
      }
    }

    function appendValue(value) {
      resetIfError();
      
      if (isEvaluated && !["+", "-", "*", "/"].includes(value)) {
        expression = "";
      }
      isEvaluated = false;

      if (value === ".") {
        const parts = expression.split(/[\+\-\*\/]/);
        const currentPart = parts[parts.length - 1];
        if (currentPart.includes(".")) return;
        if (currentPart === "") expression += "0";
      }

      if (expression === "0" && value !== ".") {
        expression = value;
      } else {
        expression += value;
      }
      
      updateDisplay();
    }

    function handleOperator(operator) {
      resetIfError();
      isEvaluated = false;
      
      if (!expression) {
        if (operator === "-") expression = "-";
        updateDisplay();
        return;
      }

      const lastChar = expression.slice(-1);
      
      if (["+", "-", "*", "/"].includes(lastChar)) {
        expression = expression.slice(0, -1) + operator;
      } else {
        expression += operator;
      }
      
      updateDisplay();
    }

    function clearDisplay() {
      expression = "";
      isEvaluated = false;
      updateDisplay();
    }

    function backspace() {
      if (isEvaluated) {
        clearDisplay();
        return;
      }
      resetIfError();
      expression = expression.slice(0, -1);
      updateDisplay();
    }

    function calculate() {
      resetIfError();
      if (!expression) return;

      try {
        const safeExpression = expression.replace(/[^0-9+\-*/. ]/g, "");
        const result = Function(`"use strict"; return (${safeExpression})`)();

        if (!Number.isFinite(result)) {
          expression = "Error";
        } else {
          expression = String(parseFloat(result.toFixed(10)));
          isEvaluated = true;
        }
      } catch {
        expression = "Error";
      }

      updateDisplay();
    }

    document.querySelectorAll(".number").forEach(button => {
      button.addEventListener("click", () => appendValue(button.dataset.value));
    });

    document.querySelectorAll(".operator").forEach(button => {
      button.addEventListener("click", () => {
        const action = button.dataset.action;
        if (action === "backspace") {
          backspace();
        } else if (action === "clear") {
          clearDisplay();
        } else {
          handleOperator(button.dataset.value);
        }
      });
    });

    document.querySelector(".equals").addEventListener("click", calculate);

    updateDisplay();
  </script>
</body>
</html>
