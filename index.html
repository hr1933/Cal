<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1f2937, #111827);
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: 300px;
      background: #f3f4f6;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    }

    #display {
      width: 100%;
      height: 60px;
      font-size: 2rem;
      text-align: right;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      padding: 10px 12px;
      margin-bottom: 18px;
      color: #111827;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 55px;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .number {
      background: #e5e7eb;
      color: #111827;
    }

    .operator {
      background: #f59e0b;
      color: white;
    }

    .clear {
      background: #ef4444;
      color: white;
    }

    .equals {
      background: #10b981;
      color: white;
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input id="display" type="text" disabled />

    <div class="buttons">
      <button class="clear" data-action="clear">C</button>
      <button class="operator" data-value="/">÷</button>
      <button class="operator" data-value="*">×</button>
      <button class="operator" data-value="-">−</button>

      <button class="number" data-value="7">7</button>
      <button class="number" data-value="8">8</button>
      <button class="number" data-value="9">9</button>
      <button class="operator" data-value="+">+</button>

      <button class="number" data-value="4">4</button>
      <button class="number" data-value="5">5</button>
      <button class="number" data-value="6">6</button>
      <button class="operator" data-action="backspace">⌫</button>

      <button class="number" data-value="1">1</button>
      <button class="number" data-value="2">2</button>
      <button class="number" data-value="3">3</button>
      <button class="number" data-value=".">.</button>

      <button class="number" data-value="0" style="grid-column: span 2;">0</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    let expression = "";

    function updateDisplay() {
      display.value = expression || "0";
    }

    function appendValue(value) {
      if (value === "." && expression.includes(".")) {
        return;
      }
      expression += value;
      updateDisplay();
    }

    function handleOperator(operator) {
      const lastChar = expression.slice(-1);

      if (!expression || ["+", "-", "*", "/"].includes(lastChar)) {
        return;
      }

      expression += operator;
      updateDisplay();
    }

    function clearDisplay() {
      expression = "";
      updateDisplay();
    }

    function backspace() {
      expression = expression.slice(0, -1);
      updateDisplay();
    }

    function calculate() {
      try {
        const result = Function(`"use strict"; return (${expression})`)();

        if (!Number.isFinite(result)) {
          expression = "Error";
        } else {
          expression = Number.isInteger(result) ? String(result) : String(parseFloat(result.toFixed(10)));
        }
      } catch {
        expression = "Error";
      }

      updateDisplay();
    }

    document.querySelectorAll(".number").forEach(button => {
      button.addEventListener("click", () => {
        if (expression === "Error") {
          expression = "";
        }
        appendValue(button.dataset.value);
      });
    });

    document.querySelectorAll(".operator").forEach(button => {
      button.addEventListener("click", () => {
        const action = button.dataset.action;

        if (action === "backspace") {
          backspace();
          return;
        }

        if (action === "clear") {
          clearDisplay();
          return;
        }

        handleOperator(button.dataset.value);
      });
    });

    document.querySelector(".equals").addEventListener("click", calculate);

    updateDisplay();
  </script>
</body>
</html>
